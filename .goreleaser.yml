version: 2
before:
  hooks:
    - go mod tidy -v
builds:
  - id: universal
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/nezhahq/agent/pkg/monitor.Version={{.Version}} -X main.arch={{.Arch}}
      # Self-update repository (owner/repo); unset NZ_AGENT_UPDATE_REPO keeps the upstream sources.
      - -X main.updateRepo={{ envOrDefault "NZ_AGENT_UPDATE_REPO" "" }}
    goos:
      - linux
      - windows
      - freebsd
      - darwin
    goarch:
      - arm
      - arm64
      - 386
      - amd64
      - mips
      - mipsle
      - s390x
      - riscv64
      - loong64
    gomips:
      - softfloat
    ignore:
      - goos: windows
        goarch: arm
    main: ./cmd/agent
    binary: nezha-agent
snapshot:
  version_template: "nezha-agent"
